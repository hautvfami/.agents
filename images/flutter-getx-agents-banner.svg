      <rect x="364" width="164" height="68" rx="18" fill="#152338" stroke="#33455F"/>
      <circle cx="396" cy="34" r="12" fill="#F2B84B"/>
      <path d="M391 31l5-5 5 5M396 26v16" stroke="#0F1B2D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="420" y="42" fill="#E9EEF4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700">Ship</text>
    </g>

    <text x="526" y="409" fill="#7F8FA3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Architecture • GetX • Retrofit • Drift • Design • Automation</text>
