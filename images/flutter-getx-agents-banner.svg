<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Flutter + GetX .agents</title>
  <desc id="desc">Professional dark banner with warm yellow accents for a Flutter and GetX agent skills repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1524"/>
      <stop offset="1" stop-color="#15253A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18283E"/>
      <stop offset="1" stop-color="#111D2E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="140" cy="70" r="170" fill="#F2B84B" opacity=".05"/>
  <circle cx="1445" cy="470" r="220" fill="#F2B84B" opacity=".06"/>

  <!-- left code panel -->
