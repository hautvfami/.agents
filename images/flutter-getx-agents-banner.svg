  <!-- right phone card -->
  <g transform="translate(1270 58)" filter="url(#shadow)">
    <rect width="256" height="404" rx="42" fill="#0A1321" stroke="#3A4C65" stroke-width="2"/>
    <rect x="18" y="26" width="220" height="350" rx="28" fill="#142238"/>
    <rect x="91" y="12" width="74" height="9" rx="5" fill="#25364D"/>

    <text x="42" y="86" fill="#F5F7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800">Agents</text>
    <text x="42" y="113" fill="#8999AC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Build less boilerplate.</text>

    <rect x="34" y="142" width="188" height="56" rx="14" fill="#1C2C43"/>
    <circle cx="60" cy="170" r="12" fill="#F2B84B"/>
    <text x="84" y="176" fill="#EAF0F5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">GetX Architecture</text>

    <rect x="34" y="210" width="188" height="56" rx="14" fill="#1C2C43"/>
    <circle cx="60" cy="238" r="12" fill="#F2B84B"/>
    <text x="84" y="244" fill="#EAF0F5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Asset Tools</text>

    <rect x="34" y="278" width="188" height="56" rx="14" fill="#1C2C43"/>
    <circle cx="60" cy="306" r="12" fill="#F2B84B"/>
    <text x="84" y="312" fill="#EAF0F5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Practical Rules</text>

    <rect x="34" y="348" width="188" height="40" rx="12" fill="#F2B84B"/>
    <text x="86" y="374" fill="#101A28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">Run Agent</text>
