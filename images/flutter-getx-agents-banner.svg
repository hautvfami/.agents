    <rect x="56" y="70" width="390" height="46" rx="22" fill="#1A2A40"/>
    <circle cx="82" cy="93" r="6" fill="#EF6B5B"/>
    <circle cx="102" cy="93" r="6" fill="#E9B949"/>
    <circle cx="122" cy="93" r="6" fill="#5CB87A"/>
    <text x="150" y="99" fill="#B7C3D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">main.dart</text>

    <text x="84" y="153" fill="#7CB7E8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">void</text>
    <text x="132" y="153" fill="#F4D071" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">main()</text>
    <text x="200" y="153" fill="#D9E3EE" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">{</text>

    <text x="104" y="189" fill="#D9E3EE" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">runApp(</text>
    <text x="188" y="189" fill="#7CB7E8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">GetMaterialApp</text>
    <text x="330" y="189" fill="#D9E3EE" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">(</text>

    <text x="124" y="225" fill="#A9B8C9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">title:</text>
    <text x="190" y="225" fill="#F2B84B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">'AI Agents'</text>
    <text x="310" y="225" fill="#A9B8C9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">,</text>

    <text x="124" y="261" fill="#A9B8C9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">home:</text>
    <text x="188" y="261" fill="#7CB7E8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">HomePage</text>
    <text x="278" y="261" fill="#D9E3EE" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">(),</text>

    <text x="104" y="297" fill="#D9E3EE" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">));</text>
    <text x="84" y="333" fill="#D9E3EE" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">}</text>

    <rect x="86" y="356" width="122" height="28" rx="14" fill="#F2B84B" opacity=".14"/>
    <text x="105" y="376" fill="#F2B84B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">GetX focused</text>
